name: LHD release backup operations
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [backup, schedule]
        required: true
permissions:
  contents: read
concurrency:
  group: sakura-gloria-production-deploy
  cancel-in-progress: false
jobs:
  operate:
    if: ${{ github.ref == 'refs/heads/ops/lhd-release-24' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      PROD_PATH: ${{ secrets.SAKURA_PROD_PATH }}
      SSH_HOST: ${{ secrets.SAKURA_HOST }}
      SSH_PORT: ${{ secrets.SAKURA_PORT || '22' }}
      SSH_USER: ${{ secrets.SAKURA_USER }}
      SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
    steps:
      - name: Back up production or register daily LHD backup
        run: |
          set -euo pipefail
          set +x
          umask 077
          test "$PROD_PATH" = /home/gltr/www/gloria-site
          case "$MODE" in backup|schedule) ;; *) exit 1;; esac
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/release_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash --noprofile --norc -se -- $MODE" <<'REMOTE'
          set -euo pipefail
          umask 077
          web=/home/gltr/www/gloria-site
          private=/home/gltr/private/west-africa
          archive=/home/gltr/backups/site
          for d in "$web" "$private" "$archive"; do
            test -d "$d"
            test "$(realpath "$d")" = "$d"
          done
          if [ "$1" = backup ]; then
            test ! -e "$private/lhd" && test ! -L "$private/lhd"
            test -f "$private/vehicles.json" && test ! -L "$private/vehicles.json"
            bundle="$(mktemp -d "$archive/gloria-lhd-release-XXXXXX")"
            tar -C "$web" -czf "$bundle/site.tar.gz" .
            tar -C "$private" -czf "$bundle/private-west-africa.tar.gz" .
            for f in "$bundle/"*.tar.gz; do gzip -t "$f"; tar -tzf "$f" >/dev/null; done
            tar -xOzf "$bundle/private-west-africa.tar.gz" ./vehicles.json | php -r '
              $data=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR);
              exit(count($data["vehicles"] ?? []) === 26 ? 0 : 1);'
            echo "backup_bundle=$bundle"
            echo "production_lhd_master_absent; production_rhd_backup_26_verified"
          else
            test -f "$web/scripts/backup-west-africa-lhd.php"
            phpbin="$(command -v php)"
            test -x "$phpbin"
            "$phpbin" "$web/scripts/backup-west-africa-lhd.php"
            tmp="$(mktemp -d "$archive/lhd-cron-XXXXXX")"
            trap 'rm -f "$tmp/current" "$tmp/new" "$tmp/readback" "$tmp/error"; rmdir "$tmp"' EXIT
            if ! crontab -l >"$tmp/current" 2>"$tmp/error"; then
              grep -qi 'no crontab' "$tmp/error" || exit 1
              : >"$tmp/current"
            fi
            entry="17 3 * * * $phpbin $web/scripts/backup-west-africa-lhd.php >/dev/null # gloria-lhd-daily-backup"
            if grep -Fq 'gloria-lhd-daily-backup' "$tmp/current"; then
              grep -Fxq "$entry" "$tmp/current"
            else
              { cat "$tmp/current"; printf '\n%s\n' "$entry"; } >"$tmp/new"
              crontab "$tmp/new"
            fi
            crontab -l >"$tmp/readback"
            grep -Fxq "$entry" "$tmp/readback"
            echo "daily_lhd_backup_registered_03_17_server_time"
            date '+server_timezone=%Z %z'
          fi
          REMOTE
