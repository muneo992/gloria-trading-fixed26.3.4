name: Check West Africa test private prepare

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-prepare-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Run local prepare script checks
        run: bash scripts/check-prepare-west-africa-test-private.sh
