name: Initialize East Africa Admin Runtime

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INIT_EA_ADMIN to initialize East Africa Admin runtime only'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/init-east-africa-admin-runtime.yml'
      - 'scripts/create-east-africa-admin-password-hash.php'

permissions:
  contents: read

jobs:
  validate-init-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Lint and dry-run the password hash helper
        env:
          DRY_RUN_PASSWORD: github-actions-dry-run-password
        run: |
          set -euo pipefail
          php -l scripts/create-east-africa-admin-password-hash.php
          HASH_FILE="${RUNNER_TEMP}/ea-admin-password.hash.dry-run"
          rm -f "$HASH_FILE"
          printf '%s' "$DRY_RUN_PASSWORD" \
            | EA_ADMIN_HASH_PATH="$HASH_FILE" php scripts/create-east-africa-admin-password-hash.php
          EA_ADMIN_HASH_PATH="$HASH_FILE" php -r '
            $path = getenv("EA_ADMIN_HASH_PATH");
            $hash = is_string($path) ? file_get_contents($path) : false;
            $info = is_string($hash) ? password_get_info($hash) : [];
            $password = getenv("DRY_RUN_PASSWORD");
            if (!is_string($hash) || ($info["algoName"] ?? "unknown") === "unknown") {
                fwrite(STDERR, "dry-run hash validation failed" . PHP_EOL);
                exit(1);
            }
            if (!is_string($password) || !password_verify($password, $hash)) {
                fwrite(STDERR, "dry-run hash verification failed" . PHP_EOL);
                exit(1);
            }
            fwrite(STDOUT, "dry-run hash created and verified" . PHP_EOL);
          '
          rm -f "$HASH_FILE"

  initialize-ea-admin-runtime:
    needs: validate-init-files
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'INIT_EA_ADMIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sakura-gloria-east-africa-admin-init
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SAKURA_HOST }}
      SSH_PORT: ${{ secrets.SAKURA_PORT || '22' }}
      SSH_USER: ${{ secrets.SAKURA_USER }}
      REMOTE_HELPER: /home/gltr/ea-admin-data/create-admin-password-hash.php

    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate confirmation and required secrets
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          DEPLOY_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          EA_ADMIN_PASSWORD: ${{ secrets.EA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$CONFIRM_INPUT" = INIT_EA_ADMIN
          test "$GITHUB_REF" = refs/heads/main
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$DEPLOY_KEY"
          test -n "$EA_ADMIN_PASSWORD"
          test "${#EA_ADMIN_PASSWORD}" -ge 12
          test -f scripts/create-east-africa-admin-password-hash.php

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.SAKURA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ea_admin_init_key
          chmod 600 ~/.ssh/ea_admin_init_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create and validate East Africa Admin directories
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/ea_admin_init_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash --noprofile --norc -se' <<'REMOTE'
          set -euo pipefail

          EA_ADMIN_ROOT='/home/gltr/ea-admin-data'
          PUBLIC_VEHICLES='/home/gltr/www/gloria-ea/data/vehicles.json'
          PUBLIC_IMAGE='/home/gltr/www/gloria-ea/images/EA-PBX-001/EA-PBX-001-01.jpg'
          RUNTIME_VEHICLES="$EA_ADMIN_ROOT/vehicles.json"
          HASH_FILE="$EA_ADMIN_ROOT/admin-password.hash"

          for DIRECTORY in \
            "$EA_ADMIN_ROOT" \
            "$EA_ADMIN_ROOT/backups" \
            "$EA_ADMIN_ROOT/login-attempts" \
            "$EA_ADMIN_ROOT/images"
          do
            if test -L "$DIRECTORY"; then
              echo "Refusing to use a symbolic link: $DIRECTORY" >&2
              exit 1
            fi
            mkdir -p "$DIRECTORY"
            chmod 700 "$DIRECTORY"
            test -d "$DIRECTORY"
            php -r 'exit(((fileperms($argv[1]) & 0777) === 0700) ? 0 : 1);' "$DIRECTORY"
          done

          test -r "$PUBLIC_VEHICLES"
          test -w "$EA_ADMIN_ROOT"
          test -r "$PUBLIC_IMAGE"
          test ! -e "$RUNTIME_VEHICLES"
          test ! -L "$RUNTIME_VEHICLES"
          test ! -e "$HASH_FILE"
          test ! -L "$HASH_FILE"
          REMOTE

      - name: Create and verify the admin password hash
        env:
          EA_ADMIN_PASSWORD: ${{ secrets.EA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EA_ADMIN_PASSWORD"
          test "${#EA_ADMIN_PASSWORD}" -ge 12
          scp -i ~/.ssh/ea_admin_init_key -P "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/create-east-africa-admin-password-hash.php \
            "$SSH_USER@$SSH_HOST:$REMOTE_HELPER"
          ssh -T -i ~/.ssh/ea_admin_init_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash --noprofile --norc -se' <<'REMOTE'
          set -euo pipefail
          test -f /home/gltr/ea-admin-data/create-admin-password-hash.php
          chmod 700 /home/gltr/ea-admin-data/create-admin-password-hash.php
          REMOTE
          # Sakura login shell is csh. Keep PHP off the remote command line and
          # force bash so history expansion cannot interpret the helper.
          printf '%s' "$EA_ADMIN_PASSWORD" | env -u EA_ADMIN_PASSWORD \
            ssh -T -i ~/.ssh/ea_admin_init_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash --noprofile --norc -c "exec php /home/gltr/ea-admin-data/create-admin-password-hash.php"'

      - name: Verify final East Africa Admin runtime state
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/ea_admin_init_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash --noprofile --norc -se' <<'REMOTE'
          set -euo pipefail

          EA_ADMIN_ROOT='/home/gltr/ea-admin-data'
          HASH_FILE="$EA_ADMIN_ROOT/admin-password.hash"

          for DIRECTORY in \
            "$EA_ADMIN_ROOT" \
            "$EA_ADMIN_ROOT/backups" \
            "$EA_ADMIN_ROOT/login-attempts" \
            "$EA_ADMIN_ROOT/images"
          do
            test -d "$DIRECTORY"
            test ! -L "$DIRECTORY"
            php -r 'exit(((fileperms($argv[1]) & 0777) === 0700) ? 0 : 1);' "$DIRECTORY"
          done

          test -r '/home/gltr/www/gloria-ea/data/vehicles.json'
          test -w "$EA_ADMIN_ROOT"
          test -r '/home/gltr/www/gloria-ea/images/EA-PBX-001/EA-PBX-001-01.jpg'
          test ! -e "$EA_ADMIN_ROOT/vehicles.json"
          test ! -L "$EA_ADMIN_ROOT/vehicles.json"
          test -f "$HASH_FILE"
          test ! -L "$HASH_FILE"
          php -r 'exit(((fileperms($argv[1]) & 0777) === 0600) ? 0 : 1);' "$HASH_FILE"

          php <<'PHP'
          <?php
          $path = "/home/gltr/ea-admin-data/admin-password.hash";
          $hash = file_get_contents($path);
          $info = is_string($hash) ? password_get_info($hash) : [];
          if (!is_string($hash) || $hash === "" || ($info["algoName"] ?? "unknown") === "unknown") {
              fwrite(STDERR, "Stored admin password hash validation failed." . PHP_EOL);
              exit(1);
          }
          fwrite(STDOUT, "Stored EA admin password hash passed password_get_info() validation." . PHP_EOL);
          PHP
          REMOTE

      - name: Remove remote helper and SSH key
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if test -f ~/.ssh/ea_admin_init_key && test -n "$SSH_HOST" && test -n "$SSH_USER"; then
            ssh -T -i ~/.ssh/ea_admin_init_key -p "$SSH_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'bash --noprofile --norc -c "rm -f /home/gltr/ea-admin-data/create-admin-password-hash.php"' || true
          fi
          rm -f ~/.ssh/ea_admin_init_key
