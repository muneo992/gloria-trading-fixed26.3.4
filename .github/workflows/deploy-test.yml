name: Deploy selected ref to Sakura Test (gloria-test)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_TEST to deploy to gloria-test"
        required: true
        type: string
      deploy_ref:
        description: "Branch, tag, or commit SHA to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SAKURA_TEST_PATH: /home/gltr/www/gloria-test
      SAKURA_TEST_PATH: ${{ secrets.SAKURA_TEST_PATH }}
      SAKURA_BACKUP_BASE: /home/gltr/backups/site
      SSH_HOST: ${{ secrets.SAKURA_HOST }}
      SSH_PORT: ${{ secrets.SAKURA_PORT || '22' }}
      SSH_USER: ${{ secrets.SAKURA_USER }}

    steps:
      - name: Validate confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "DEPLOY_TEST" ]; then
            echo "Confirmation text did not match DEPLOY_TEST. Deployment stopped."
            exit 1
          fi

      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0

      - name: Verify checked out ref and SHA
        env:
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          RESOLVED_SHA=""

          for CANDIDATE in \
            "$DEPLOY_REF_INPUT" \
            "refs/heads/$DEPLOY_REF_INPUT" \
            "refs/tags/$DEPLOY_REF_INPUT" \
            "origin/$DEPLOY_REF_INPUT"; do
            if git rev-parse --verify --quiet --end-of-options "${CANDIDATE}^{commit}" >/tmp/deploy-ref-sha; then
              RESOLVED_SHA="$(cat /tmp/deploy-ref-sha)"
              break
            fi
          done

          echo "GITHUB_REF=$GITHUB_REF"
          echo "inputs.deploy_ref=$DEPLOY_REF_INPUT"
          echo "resolved deploy_ref SHA=$RESOLVED_SHA"
          echo "checked out HEAD SHA=$ACTUAL_SHA"

          if [ -z "$RESOLVED_SHA" ] || [ "$ACTUAL_SHA" != "$RESOLVED_SHA" ]; then
            echo "Requested deploy_ref does not match the checked out HEAD SHA. Deployment stopped."
            exit 1
          fi

      - name: Validate Sakura test destination
        run: |
          set -euo pipefail
          echo "Configured SAKURA_TEST_PATH=$SAKURA_TEST_PATH"
          if [ "$SAKURA_TEST_PATH" != "$EXPECTED_SAKURA_TEST_PATH" ]; then
            echo "SAKURA_TEST_PATH must be exactly $EXPECTED_SAKURA_TEST_PATH. Deployment stopped."
            exit 1
          fi

      - name: Setup SSH key and known hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SAKURA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Backup current Sakura test files
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_rsa \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          TEST_PATH='/home/gltr/www/gloria-test'
          BACKUP_BASE='/home/gltr/backups/site'
          PRIVATE_PATH='/home/gltr/private/west-africa-test'
          case "$PRIVATE_PATH" in
            "$TEST_PATH"|"$TEST_PATH"/*)
              echo "Private data directory is inside the web root. Deployment stopped."
              exit 1
              ;;
          esac
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP_PATH="$BACKUP_BASE/gloria-test-before-$TS"

          test -d "$TEST_PATH"
          mkdir -p "$BACKUP_BASE"
          mkdir "$BACKUP_PATH"

          for RELATIVE_PATH in \
            'frontend/data/vehicles.json' \
            'vehicles.json' \
            'admin/vehicle-data.php'; do
            SOURCE_PATH="$TEST_PATH/$RELATIVE_PATH"
            DESTINATION_PATH="$BACKUP_PATH/$RELATIVE_PATH"
            if [ -e "$SOURCE_PATH" ]; then
              mkdir -p "$(dirname "$DESTINATION_PATH")"
              cp -p "$SOURCE_PATH" "$DESTINATION_PATH"
              test -e "$DESTINATION_PATH"
              cmp -s "$SOURCE_PATH" "$DESTINATION_PATH"
            else
              echo "Backup skipped; source does not exist: $SOURCE_PATH"
            fi
          done

          echo "Created test backup: $BACKUP_PATH"
          REMOTE

      - name: Deploy selected ref to Sakura test
        run: |
          set -euo pipefail
          rsync -avz \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='admin/.htpasswd' \
            --exclude='admin/password.txt' \
            --exclude='/frontend/data/vehicles.json' \
            --exclude='/vehicles.json' \
            --exclude='/frontend/data/backup/' \
            --exclude='/east-africa/' \
            --exclude='/south-africa/' \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./ \
            "$SSH_USER@$SSH_HOST:$SAKURA_TEST_PATH/"

      - name: Publish root symlinks for Sakura
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_rsa \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; WEB='/home/gltr/www/gloria-test'; PRIV='/home/gltr/private/west-africa-test'; case \"\$PRIV\" in \"\$WEB\"|\"\$WEB\"/*) echo 'Private data directory is inside the web root.'; exit 1 ;; esac; if [ -e \"\$WEB/private\" ]; then echo 'Web root contains a private directory.'; exit 1; fi; bash '$SAKURA_TEST_PATH/scripts/sakura-publish-links.sh' '$SAKURA_TEST_PATH'"

      - name: Validate deployed PHP syntax
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_rsa \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -e; php -l '$EXPECTED_SAKURA_TEST_PATH/admin/vehicle-data.php'; php '$EXPECTED_SAKURA_TEST_PATH/admin/health.php' | grep -q '^status: ok$'"

      - name: Smoke test gloria-test site
        run: |
          set -euo pipefail
          sleep 3
          BASE_URL="https://gltr.sakura.ne.jp/gloria-test"
          expect_status() {
            local expected="$1"
            local url="$2"
            local actual
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but received $actual from $url" >&2
              return 1
            fi
          }

          curl -I --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/"
          curl -I --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/catalog.html"
          curl --fail --silent --show-error --output /dev/null --max-time 20 "$BASE_URL/catalog.html"
          expect_status 200 "$BASE_URL/data/vehicles.json"
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/data/vehicles.json" \
            | php -r '
                $data = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
                if (!isset($data["vehicles"]) || !is_array($data["vehicles"]) || count($data["vehicles"]) < 1) {
                    fwrite(STDERR, "Public vehicle feed has no records.\n");
                    exit(1);
                }
                $private = ["quote_spec_data", "export_document_data", "vehicle_certificate_data", "quote_spec_files", "quote_image_files", "vehicle_certificate_files", "basis_from", "basis_to", "disclaimer_short", "auction_price_jpy", "target_price_usd", "customer_name", "chassis_no"];
                foreach ($data["vehicles"] as $record) {
                    if (!is_array($record)) {
                        exit(1);
                    }
                    foreach ($private as $field) {
                        if (array_key_exists($field, $record)) {
                            fwrite(STDERR, "Public vehicle feed contains a private field.\n");
                            exit(1);
                        }
                    }
                }
                echo "Public vehicle feed structure: ok\n";
              '
          expect_status 403 "$BASE_URL/vehicles.json"
          expect_status 403 "$BASE_URL/frontend/data/vehicles.json"
          expect_status 403 "$BASE_URL/data/backup/probe.json"
          expect_status 403 "$BASE_URL/frontend/data/backup/probe.json"
          expect_status 403 "$BASE_URL/uploads/quotes/probe.pdf"
          expect_status 403 "$BASE_URL/uploads/certificates/probe.pdf"
          expect_status 403 "$BASE_URL/uploads/general/probe.pdf"
          expect_status 404 "$BASE_URL/private/west-africa-test/vehicles.json"
          expect_status 404 "https://gltr.sakura.ne.jp/private/west-africa-test/vehicles.json"
          expect_status 404 "$BASE_URL/admin/health.php"
          expect_status 404 "$BASE_URL/admin/index.php?diag=1"
          expect_status 200 "$BASE_URL/admin/"
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/admin/" | grep -q "管理画面"
          curl -I --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/west-africa/ghana"
          curl -I --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/west-africa/cote-divoire"
          curl -sI --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/ghana.html" | grep -i "^Location:" | grep -q "/gloria-test/west-africa/ghana"
          curl -sI --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/nigeria.html" | grep -i "^Location:" | grep -q "/gloria-test/west-africa/nigeria"
          curl -sI --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/benin.html" | grep -i "^Location:" | grep -q "/gloria-test/west-africa/benin"
          curl -sI --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/ivory-coast.html" | grep -i "^Location:" | grep -q "/gloria-test/west-africa/cote-divoire"
          curl -sI --fail --max-time 20 "https://gltr.sakura.ne.jp/gloria-test/west-africa/ivory-coast" | grep -i "^Location:" | grep -q "/gloria-test/west-africa/cote-divoire"
