name: Deploy South Africa to Sakura

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PREPARE_SA_ADMIN_DATA for stage-0 directory setup, or DEPLOY_SA to deploy South Africa only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sakura-gloria-south-africa-deploy
  cancel-in-progress: false

jobs:
  prepare-sa-admin-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/south-africa-admin-v1' && inputs.confirm == 'PREPARE_SA_ADMIN_DATA' }}
    env:
      SSH_HOST: ${{ secrets.SAKURA_HOST }}
      SSH_PORT: ${{ secrets.SAKURA_PORT || '22' }}
      SSH_USER: ${{ secrets.SAKURA_USER }}
    steps:
      - name: Validate confirmation
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM_INPUT" = PREPARE_SA_ADMIN_DATA
          test "$GITHUB_REF" = refs/heads/south-africa-admin-v1
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.SAKURA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sa_prepare_key
          chmod 600 ~/.ssh/sa_prepare_key
          sudo apt-get update
          sudo apt-get install -y openssh-client
          : > ~/.ssh/known_hosts
          ok=0
          for _ in 1 2 3; do
            if ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          test -s ~/.ssh/known_hosts
          ssh -i ~/.ssh/sa_prepare_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'echo ssh_ok'

      - name: Inspect PHP and create sa-admin-data only
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/sa_prepare_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          echo '=== php -v ==='
          php -v
          echo '=== php modules ==='
          php -m | grep -E '^(fileinfo|json|session)$' || true
          php -r 'echo "PHP_VERSION=" . PHP_VERSION . PHP_EOL; echo "PHP81=" . (PHP_VERSION_ID >= 80100 ? "yes" : "no") . PHP_EOL;'
          php -r 'foreach (["json","session","fileinfo"] as $e) { echo $e . "=" . (extension_loaded($e) ? "yes" : "no") . PHP_EOL; }'
          php -r 'echo "password_hash=" . (function_exists("password_hash") ? "yes" : "no") . PHP_EOL; echo "getimagesize=" . (function_exists("getimagesize") ? "yes" : "no") . PHP_EOL;'

          DATA='/home/gltr/sa-admin-data'
          test "$DATA" != '/home/gltr/ea-admin-data'
          test "$DATA" != '/home/gltr/www/gloria-sa'
          test "$DATA" != '/home/gltr/www/gloria-ea'
          if [ -e "$DATA" ] && [ -L "$DATA" ]; then
            echo "Refusing to use symlink: $DATA"
            exit 1
          fi
          install -d -m 700 "$DATA"
          install -d -m 700 "$DATA/backups"
          install -d -m 700 "$DATA/login-attempts"
          install -d -m 700 "$DATA/images"
          for DIR in "$DATA" "$DATA/backups" "$DATA/login-attempts" "$DATA/images"; do
            test -d "$DIR"
            test ! -L "$DIR"
            test "$(cd "$DIR" && pwd -P)" = "$DIR"
            DIR="$DIR" php -r '$d=getenv("DIR"); if (!is_string($d) || !is_dir($d) || is_link($d)) { fwrite(STDERR, "bad dir\n"); exit(1);} $perm=substr(sprintf("%o", fileperms($d)), -3); $owner=function_exists("posix_getpwuid") ? (posix_getpwuid(fileowner($d))["name"] ?? "") : (string)fileowner($d); echo $d, " owner=", $owner, " perm=", $perm, PHP_EOL; if ($perm !== "700") { fwrite(STDERR, "perm not 700\n"); exit(1);} if (!is_writable($d)) { fwrite(STDERR, "not writable\n"); exit(1); }'
          done
          test ! -e "$DATA/admin-password.hash"
          test ! -e "$DATA/vehicles.json"

          TESTFILE="$DATA/.php-write-probe"
          php -r '$p=getenv("SA_PROBE"); if (!is_string($p) || $p==="") { $p="/home/gltr/sa-admin-data/.php-write-probe"; } if (file_put_contents($p, "ok") === false) { fwrite(STDERR, "php write failed\n"); exit(1); }'
          test -f "$TESTFILE"
          rm -f "$TESTFILE"
          test ! -f "$TESTFILE"
          echo "php_write_probe=ok"
          echo "whoami=$(whoami)"
          id
          REMOTE

      - name: Confirm public South Africa URLs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://sa.gloriatrading.com/ -o /tmp/sa-home.html
          curl --fail --silent --show-error --max-time 30 https://sa.gloriatrading.com/vehicles.html -o /tmp/sa-vehicles.html
          curl --fail --silent --show-error --max-time 30 https://sa.gloriatrading.com/data/vehicles.json -o /tmp/sa-vehicles.json
          grep -q 'RHD EV' /tmp/sa-home.html
          grep -q 'Import requirements must be confirmed before shipment' /tmp/sa-home.html
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/sa-vehicles.json",encoding="utf-8"))
          assert "vehicles" in data and len(data["vehicles"])>=1
          print("public_json_vehicles", len(data["vehicles"]))
          PY
          echo 'public_urls=ok'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/sa_prepare_key

  deploy-sa:
    runs-on: ubuntu-latest
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/south-africa-phase1' || github.ref == 'refs/heads/south-africa-admin-v1') && inputs.confirm == 'DEPLOY_SA' }}
    env:
      SA_PATH: /home/gltr/www/gloria-sa
      SSH_HOST: ${{ secrets.SAKURA_HOST }}
      SSH_PORT: ${{ secrets.SAKURA_PORT || '22' }}
      SSH_USER: ${{ secrets.SAKURA_USER }}
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate source and destination
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM_INPUT" = DEPLOY_SA
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/south-africa-phase1|refs/heads/south-africa-admin-v1) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SA_PATH" = /home/gltr/www/gloria-sa
          test "$SA_PATH" != /home/gltr/www/gloria-ea
          test "$SA_PATH" != /home/gltr/www/gloria-site
          test -f south-africa/index.html
          test -f south-africa/data/vehicles.json
          test -f south-africa/js/sa.js
          test -z "$(find south-africa -type l -print -quit)"
          node --check south-africa/js/sa.js
          node scripts/check-south-africa.js
          python3 scripts/check-south-africa.py

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.SAKURA_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sa_deploy_key
          chmod 600 ~/.ssh/sa_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Validate remote directory and back up South Africa
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/sa_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          SA_PATH='/home/gltr/www/gloria-sa'
          EA_PATH='/home/gltr/www/gloria-ea'
          test "$SA_PATH" = /home/gltr/www/gloria-sa
          test "$SA_PATH" != "$EA_PATH"
          if [ ! -d "$SA_PATH" ]; then
            echo "South Africa destination does not exist: $SA_PATH"
            echo "Create this directory on Sakura before the first deployment. This workflow will not create it."
            exit 1
          fi
          test ! -L "$SA_PATH"
          test "$(cd "$SA_PATH" && pwd -P)" = "$SA_PATH"
          test -z "$(find "$SA_PATH" -type l -print -quit)"
          BACKUP_BASE='/home/gltr/sa-backups'
          mkdir -p "$BACKUP_BASE"
          chmod 700 "$BACKUP_BASE"
          BACKUP_FILE="$BACKUP_BASE/gloria-sa-$(date -u +%Y%m%d-%H%M%S)-$$.tar.gz"
          umask 077
          tar -C "$SA_PATH" -czf "$BACKUP_FILE" .
          test -s "$BACKUP_FILE"
          tar -tzf "$BACKUP_FILE" >/dev/null
          echo "South Africa backup: $BACKUP_FILE"
          REMOTE

      - name: Deploy South Africa files only
        run: |
          set -euo pipefail
          test "$SA_PATH" = /home/gltr/www/gloria-sa
          test "$SA_PATH" != /home/gltr/www/gloria-ea
          rsync -az --checksum --delay-updates \
            -e "ssh -i ~/.ssh/sa_deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            south-africa/ "$SSH_USER@$SSH_HOST:$SA_PATH/"
          CHANGES="$(rsync -aznci \
            -e "ssh -i ~/.ssh/sa_deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            south-africa/ "$SSH_USER@$SSH_HOST:$SA_PATH/")"
          test -z "$CHANGES"

      - name: Verify South Africa public pages
        run: |
          set -euo pipefail
          for PAGE in '' vehicles.html how-to-buy.html about.html contact.html request.html vehicle-detail.html css/base.css css/sa.css js/sa.js images/gloria-trading-logo.jpg data/vehicles.json robots.txt sitemap.xml; do
            curl --fail --silent --show-error --max-time 30 "https://sa.gloriatrading.com/$PAGE" -o /dev/null
          done
          curl --fail --silent --show-error --max-time 30 https://sa.gloriatrading.com/ -o /tmp/sa-home.html
          grep -q 'RHD EV' /tmp/sa-home.html
          grep -q 'https://sa.gloriatrading.com/' /tmp/sa-home.html
          grep -q 'Import requirements must be confirmed before shipment' /tmp/sa-home.html

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/sa_deploy_key
